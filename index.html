  lessons: [{"n":1,"title":"Introduzione, fonetica, fonologia, morfologia","qs":[["Cos'è l'ambiguità secondo il glossario del corso?",["La proprietà per cui una stessa espressione linguistica può essere interpretata in più modi","Una proprietà dei codici il cui numero di elementi è finito","L'assenza di una relazione naturale tra forma e significato","La capacità di produrre frasi nuove"],0,"L'ambiguità è la proprietà per cui una stessa espressione linguistica può essere interpretata in più modi."],["Cosa si intende per \"articolatezza\" di un codice?",["La capacità di un codice di essere ambiguo","La proprietà dei codici i cui segni possono essere scomposti in unità più piccole e ricombinabili","La capacità di generare messaggi infiniti","L'assenza di sinonimia"],1,"L'articolatezza è la scomponibilità dei segni in unità più piccole e ricombinabili."],["La fonetica acustica studia:",["Come gli organi dell'apparato fonatorio producono i suoni","La percezione dei suoni da parte dell'apparato uditivo","Il suono linguistico come fenomeno fisico (frequenza, intensità, durata)","L'organizzazione dei suoni all'interno di una lingua"],2,"La fonetica acustica studia il suono come fenomeno fisico (frequenza, intensità, durata); (A) è fonetica articolatoria, (B) è fonetica uditiva."],["Che cos'è un fonema?",["Una variante fonetica priva di valore distintivo","Un insieme di restrizioni sulla combinazione dei suoni","Una coppia di parole che differiscono per un solo suono","L'unità minima astratta del sistema fonologico capace di distinguere significati"],3,"Il fonema è l'unità minima astratta del sistema fonologico capace di distinguere significati; (A) descrive l'allofono, (C) la coppia minima, (B) la fonotassi."],["Che cosa distingue un morfema libero da uno legato?",["Il morfema libero può comparire autonomamente, quello legato deve combinarsi con altre unità","Il morfema libero è sempre un prefisso","Il morfema legato ha significato lessicale, quello libero grammaticale","Non c'è alcuna differenza sostanziale"],0,"Il morfema libero può comparire da solo, quello legato deve combinarsi con altre unità."],["In una lingua agglutinante:",["Un singolo morfo esprime più informazioni grammaticali contemporaneamente","Morfemi distinti e facilmente separabili vengono concatenati per costruire le parole","Le parole tendono a essere costituite da morfemi autonomi","Una singola parola può rappresentare un'intera frase"],1,"Nella lingua agglutinante morfemi distinti e separabili vengono concatenati; (A) descrive la lingua flessiva, (C) la lingua isolante, (D) la lingua polisintetica."],["Secondo il glossario del corso, che cos'è la sillaba?",["Un insieme di restrizioni sulla combinazione dei suoni all'interno di una lingua","L'unità minima astratta del sistema fonologico capace di distinguere significati","Un'unità fonologica organizzata intorno a un nucleo, generalmente vocalico","Una variante fonetica priva di valore distintivo"],2,"La sillaba è un'unità fonologica organizzata intorno a un nucleo, generalmente vocalico."],["Che cosa indica, nel glossario del corso, l'espressione \"povertà dello stimolo\"?",["Il fatto che alcune lingue abbiano un numero ridotto di fonemi","La scarsità di sinonimi in un codice articolato","La difficoltà del cervello a distinguere suoni simili in lingue straniere","Il fatto che l'input linguistico ricevuto dal bambino sia limitato e imperfetto rispetto alla complessità della competenza linguistica che arriva a possedere"],3,"La povertà dello stimolo indica che l'input linguistico ricevuto dal bambino è limitato e imperfetto rispetto alla complessità della competenza linguistica che arriva a possedere."],["Qual è la differenza tra omonimia e polisemia secondo il glossario del corso?",["Nella polisemia i significati di una stessa forma sono correlati tra loro, mentre nell'omonimia la coincidenza tra forme è puramente formale e i significati non sono necessariamente collegati","Sono due nomi diversi per lo stesso identico fenomeno","L'omonimia riguarda solo i suoni, la polisemia solo la sintassi","La polisemia esiste solo nei codici della certezza, l'omonimia nei codici articolati"],0,"Nella polisemia i significati di una stessa forma sono correlati; nell'omonimia la coincidenza è solo formale e i significati non sono necessariamente collegati."]]},{"n":2,"title":"Le proprietà universali del linguaggio: i codici della certezza","qs":[["Secondo la tesi sostenuta nel corso, cosa ha permesso al linguaggio umano di esprimere pienamente le sue potenzialità simboliche?",["L'invenzione della scrittura ideografica","La nascita della stampa a caratteri mobili","L'alfabeto fonetico, inventato dai fenici e perfezionato dai greci","Lo sviluppo dell'intelligenza artificiale"],2,"L'alfabeto fonetico, inventato dai fenici e perfezionato dai greci, diede piena espressione al carattere articolato del linguaggio."],["I messaggi diadici sono caratterizzati da:",["Un referente esterno percepibile in praesentia","La presenza di sinonimia","Una struttura combinatoria infinita","L'assenza di un referente: veicolano emozioni o intenzioni tra due esemplari della stessa specie"],3,"I messaggi diadici sono privi di referente e veicolano emozioni/intenzioni tra due esemplari della stessa specie."],["Le grida di allarme dei cercopitechi verdi sono un esempio di:",["Messaggio triadico con referente prossimo","Codice diadico","Codice articolato con sinonimia","Codice seriale"],0,"Sono messaggi triadici con referente prossimo percepibile in praesentia."],["Cosa permette al leopardo di continuare a inseguire un'antilope anche quando questa non è più visibile?",["La sinonimia","La permanenza dell'oggetto","L'arbitrarietà del segno","La ricorsività"],1,"La permanenza dell'oggetto è la capacità di ricordare un referente anche quando non è più percepito."],["I codici seriali, come lo Zodiaco o i giorni della settimana, si distinguono per:",["L'assenza di un ordine tra i segni","L'infinita combinabilità degli elementi","La possibilità di ordinare i significati secondo una serie","La presenza di sinonimia calcolabile"],2,"I codici seriali possiedono significati che possono essere ordinati secondo una serie."],["Su quale opera si basa in gran parte il quadro teorico delle lezioni del corso relative alla classificazione semantica dei codici?",["\"The Origins of Language\" di J.R. Hurford","\"Messaggio senza parole\" di Martin Lindauer","Un trattato di fonetica acustica","\"Minisemantica\" di Tullio De Mauro (1997)"],3,"Il quadro teorico di riferimento è la classificazione semantica dei codici elaborata da Tullio De Mauro in \"Minisemantica\" (1997)."],["Perché il corso limita l'analisi alla comunicazione intraspecifica (tra membri della stessa specie)?",["Perché è proprio nelle relazioni tra membri della stessa specie che i codici di comunicazione si sono evoluti e hanno accresciuto la propria complessità","Perché la comunicazione interspecifica non esiste in natura","Perché solo gli esseri umani comunicano tra loro","Perché la comunicazione interspecifica riguarda esclusivamente i codici della certezza"],0,"È nelle relazioni intraspecifiche che i codici di comunicazione si sono evoluti e hanno accresciuto la propria complessità."],["Perché parole come l'italiano \"ciao\" o l'inglese \"hello\" sono considerate esempi di messaggio diadico?",["Perché possono avere più significati correlati tra loro","Perché non hanno alcun referente esterno: segnalano solo la compresenza di due esemplari della stessa specie","Perché sono parole prive di valore fonetico","Perché rinviano sempre a un oggetto concreto presente nel contesto"],1,"Parole come \"ciao\" o \"hello\" non hanno referente: segnalano solo la compresenza di due esemplari della stessa specie."]]},{"n":3,"title":"Codici articolati, sinonimia, polisemia, ambiguità","qs":[["Secondo Julian Jaynes, in quale periodo si colloca il balzo cognitivo che ha permesso di sfruttare pienamente il carattere articolato del linguaggio?",["Con l'invenzione della stampa","Tra il 3.500 a.C. e l'anno zero","Durante il Rinascimento","Tra il 70.000 e l'8.000 a.C."],3,"Jaynes colloca questo balzo cognitivo nel Pleistocene superiore, tra il 70.000 e l'8.000 a.C."],["Qual è la prima delle tre condizioni combinatorie indicate da De Mauro perché un codice articolato possieda un numero infinito di segni con sinonimia?",["L'ordine (la disposizione) delle entità combinabili è un fattore di diversità","La ripetizione di un elemento deve distinguere raggruppamenti diversi","Il numero dei posti dei raggruppamenti non deve avere limite teorico","I significanti devono corrispondere biunivocamente ai referenti"],0,"La condizione a) di De Mauro riguarda l'ordine/disposizione delle entità combinabili come fattore di diversità."],["La frase \"Mario osserva Maria\" ha un significato diverso da \"Maria osserva Mario\": quale proprietà combinatoria illustra questo esempio?",["La proprietà b) della ripetizione","La proprietà a), cioè l'importanza dell'ordine/disposizione","La proprietà c) dell'assenza di limite teorico","La sinonimia calcolabile"],1,"L'esempio mostra che l'ordine (proprietà a) cambia il significato della frase."],["Perché l'aritmetica, pur essendo sinonimica come le lingue naturali, se ne differenzia?",["Perché le lingue non hanno mai sinonimi","Perché l'aritmetica non possiede affatto sinonimia","Perché nell'aritmetica la sinonimia è calcolabile, mentre nelle lingue è incalcolabile","Perché l'aritmetica è priva di regole combinatorie"],2,"L'aritmetica ha sinonimia calcolabile (es. 2+2 = 1+3 = 4), le lingue naturali hanno sinonimia incalcolabile."],["La parola \"macchine\" in frasi come \"Ho comprato due macchine usate\" e \"Quei calciatori sono delle macchine\" è un esempio di:",["Ambiguità strutturale","Codice diadico","Sinonimia","Polisemia"],3,"È polisemia: la stessa parola assume significati diversi (autovetture / calciatori / computer) a seconda del contesto."],["La frase \"Mario vide suo padre in piazza col binocolo\", che può essere interpretata in due modi diversi, è un esempio di:",["Ambiguità strutturale","Polisemia lessicale","Codice della certezza","Distribuzione complementare"],0,"È ambiguità strutturale: la frase ammette due strutture sintattiche diverse (chi usa il binocolo)."],["Qual è, secondo De Mauro, la terza condizione combinatoria perché un codice articolato possieda un numero infinito di segni con sinonimia?",["L'ordine delle entità combinabili è un fattore di diversità","Il numero dei posti dei raggruppamenti non deve avere limite teorico: dato un raggruppamento di n entità, deve sempre poterne esistere uno di n+1","La ripetizione di un elemento deve distinguere raggruppamenti diversi","I significanti devono corrispondere biunivocamente ai referenti"],1,"La terza condizione richiede che il numero dei posti dei raggruppamenti non abbia limite teorico: dato un raggruppamento di n entità, deve sempre poterne esistere uno di n+1."],["L'esempio \"Mario aiuta a fare le pulizie Maria che aiuta a fare le pulizie Giorgio che aiuta a fare le pulizie Luisa\" illustra quale proprietà del linguaggio?",["L'arbitrarietà del segno","La discretezza","La ricorsività: la possibilità di inserire ripetutamente una struttura dentro un'altra dello stesso tipo","La sinonimia calcolabile"],2,"È ricorsività: la struttura Fn che Fn+1 permette di inserire ripetutamente una frase dentro un'altra dello stesso tipo."],["La frase \"Prendimi il giubbino quando sali\", il cui significato cambia a seconda che sia pronunciata davanti al portone, in cucina o altrove, esemplifica quale tipo di ambiguità?",["Ambiguità strutturale, perché la frase ammette due analisi sintattiche diverse","Polisemia lessicale della parola \"giubbino\"","Omonimia tra due parole diverse","Ambiguità pragmatica, legata al contesto situazionale in cui la frase viene pronunciata"],3,"È ambiguità pragmatica: il significato dipende dal contesto situazionale in cui la frase viene pronunciata, non dalla struttura sintattica."]]},{"n":4,"title":"Modularità, costituenti, ricorsività, discretezza, produttività, arbitrarietà","qs":[["Secondo la concezione modulare del linguaggio:",["Il linguaggio è un sistema unico e indivisibile","Le persone producono e interpretano il linguaggio utilizzando un insieme di sottosistemi (moduli) coordinati tra loro","Solo la fonetica costituisce un modulo autonomo","I moduli linguistici non comunicano tra loro"],1,"Il linguaggio è concepito come un sistema di sottosistemi (moduli) coordinati, ciascuno responsabile di una parte dell'elaborazione."],["Cosa permette alla frase \"Questo è il topo che ha rosicchiato il formaggio che si trovava nella casa che Jack ha costruito\" di essere costruita?",["L'arbitrarietà del segno","La discretezza","La ricorsività","La variabilità linguistica"],2,"È la ricorsività a permettere di inserire ripetutamente frasi dentro frasi, senza limite teorico."],["L'esempio della distinzione tra \"pat\" e \"pet\" in inglese, difficile da percepire per i tedeschi, illustra:",["La ricorsività","La produttività del linguaggio","L'arbitrarietà dei suoni","La discretezza, che varia da lingua a lingua"],3,"È discretezza: ciò che è discreto (distinguibile) varia da lingua a lingua."],["Perché il fatto che in inglese si dica \"one, two, three\" e in cinese \"yi, er, san\" dimostra l'arbitrarietà del linguaggio?",["Perché nessuna delle due lingue possiede la \"parola giusta\" per i numeri: non esiste una connessione necessaria tra forma e significato","Perché il cinese ha più numeri dell'inglese","Perché l'inglese è una lingua più antica del cinese","Perché entrambe le lingue condividono la stessa origine"],0,"L'arbitrarietà significa che non esiste una \"parola giusta\": nessuna connessione necessaria lega forma e significato."],["Quando un parlante conia spontaneamente una nuova parola comprensibile nel contesto e formata secondo le regole della lingua, si parla di:",["Ricorsività","Produttività","Discretezza","Codice della certezza"],1,"È la produttività: la capacità di generare continuamente nuove parole comprensibili nel contesto."],["In cosa consiste il test di sostituzione usato per individuare i costituenti di una frase?",["Nel verificare se una parola può essere pronunciata con accento diverso","Nel contare il numero di sillabe di una parola","Nel verificare se una sequenza di parole può essere sostituita da un'altra espressione mantenendo la frase grammaticale: solo le sequenze che costituiscono un costituente reale superano la prova","Nel tradurre la frase in un'altra lingua"],2,"Il test consiste nel sostituire una sequenza di parole con un'altra espressione mantenendo la frase grammaticale: solo un costituente reale supera la prova."],["L'esempio dell'inglese \"fat man\" e del francese \"homme gros\" (dove l'aggettivo precede o segue il sostantivo a seconda della lingua) illustra quale proprietà del linguaggio?",["La ricorsività","La discretezza","La produttività","L'arbitrarietà: non esiste un ordine \"naturale\" e necessario tra aggettivo e sostantivo, ogni lingua fissa convenzionalmente la propria regola"],3,"Non esiste un ordine necessario tra aggettivo e sostantivo: ogni lingua fissa convenzionalmente la propria regola, a riprova dell'arbitrarietà del segno."],["Il fatto che l'inglese americano possieda molti termini distinti per i veicoli (sedan, sports utility vehicle, minivan, convertible, wagon, sports car) è portato come esempio di cosa?",["Discretezza: una lingua può ritagliare la realtà in categorie distinte in modo diverso da un'altra, riflettendo ciò che è culturalmente rilevante","Ricorsività sintattica","Ambiguità strutturale","Codice della certezza"],0,"È discretezza: lingue diverse ritagliano la realtà in categorie distinte in modo diverso, riflettendo ciò che è culturalmente rilevante."]]},{"n":5,"title":"Variabilità, approccio descrittivo, definire il linguaggio, costo biologico","qs":[["Secondo l'approccio descrittivo, i linguisti:",["Stabiliscono quali forme linguistiche sono corrette o scorrette","Considerano alcune varietà linguistiche intrinsecamente migliori di altre","Accettano il linguaggio così come lo trovano, senza regolamentarlo in base a criteri preconcetti","Si occupano solo delle lingue scritte"],2,"I linguisti descrivono il linguaggio come lo trovano, senza giudicarlo in base a criteri di correttezza preconcetti."],["Le persone usano la variabilità linguistica per:",["Segnalare esclusivamente il proprio livello di istruzione","Rendere il linguaggio più simile a un codice matematico","Eliminare ogni forma di ambiguità dal messaggio","Comunicare la propria identità sociale, geografica, il contesto e lo scopo della comunicazione"],3,"La variabilità serve a comunicare identità sociale, origine, contesto e scopo della comunicazione."],["Secondo la definizione di linguaggio ripresa da Finegan e Besnier, la competenza grammaticale è:",["La parte del sistema che consente ai parlanti di produrre e interpretare frasi grammaticali","La capacità di usare il linguaggio in modo adeguato al contesto sociale","La capacità di apprendere più lingue contemporaneamente","L'insieme delle regole di cortesia linguistica"],0,"La competenza grammaticale è la parte del sistema che consente di produrre e interpretare frasi grammaticali."],["Perché il cervello umano, pur costituendo una piccola percentuale della massa corporea, rappresenta un costo biologico così elevato?",["Perché è l'unico organo che non si è mai evoluto","Perché consuma una quota sproporzionatamente alta dell'energia disponibile nell'organismo","Perché è più pesante degli altri organi","Perché non produce alcun vantaggio adattativo"],1,"Il cervello consuma una quota sproporzionatamente elevata dell'energia disponibile nell'organismo."],["Il linguaggio viene descritto nella lezione 5 come:",["Un semplice prodotto collaterale dell'aumento delle dimensioni cerebrali","Un sistema che non richiede alcun investimento metabolico","Una sorta di memoria collettiva esterna al singolo individuo, capace di accumularsi nel tempo","Uno strumento utile solo per la sopravvivenza individuale, non di gruppo"],2,"Il linguaggio è descritto come una memoria collettiva esterna al singolo individuo, destinata ad accrescersi."],["Cosa illustrano esempi come l'inglese \"She can't find nothing\" (doppio negativo) o \"knowed\" al posto di \"knew\"?",["Errori che dimostrano un deficit di competenza grammaticale","L'assenza totale di regole nelle varietà non standard","Una forma di codice della certezza","La variabilità linguistica: forme non standard, comunque governate da regole proprie, che una persona può usare pur avendo ricevuto un'ottima istruzione grammaticale"],3,"Sono esempi di variabilità linguistica: forme non standard, comunque regolate, che una persona può usare pur avendo ricevuto un'ottima istruzione grammaticale."],["L'esempio della frase \"Il cane inseguì il gatto sull'albero\", utilizzabile per raccontare una storia, lamentarsi con il proprietario del cane o aiutare a ritrovare il gatto, illustra quale nozione?",["La competenza comunicativa: la stessa frase, con la stessa competenza grammaticale, può servire a scopi comunicativi diversi a seconda del contesto","La ricorsività sintattica","L'arbitrarietà del segno","La povertà dello stimolo"],0,"È competenza comunicativa: la stessa frase, con la stessa competenza grammaticale, può servire a scopi comunicativi diversi a seconda del contesto."],["Secondo la lezione, perché l'elevato costo biologico del linguaggio sarebbe stato \"ripagato\" nel corso dell'evoluzione umana?",["Perché ha permesso di eliminare la necessità di cooperare tra individui","Perché ha sostenuto forme di cooperazione sempre più estese e sofisticate, indispensabili alla sopravvivenza della specie (caccia, difesa del gruppo, cura della prole)","Perché ha reso il cervello umano più leggero","Perché ha eliminato la variabilità linguistica"],1,"Il costo biologico del linguaggio è stato ripagato dal sostegno a forme di cooperazione sempre più estese, indispensabili alla sopravvivenza della specie."]]},{"n":6,"title":"L'ambiguità come vantaggio evolutivo; le grandi transizioni tecnologiche","qs":[["Secondo la lezione, l'ambiguità del linguaggio naturale:",["È soltanto un difetto che i linguaggi formali di matematica e informatica cercano di eliminare","Riguarda esclusivamente il linguaggio poetico","È del tutto assente nelle lingue storico-naturali","Non appare come un'imperfezione del sistema, ma come una delle condizioni che ne hanno reso possibile il successo adattativo"],3,"L'ambiguità è presentata come una delle condizioni del successo adattativo del linguaggio, non come un difetto."],["Parole come \"rete\", \"finestra\", \"navigare\" o \"virus\" hanno acquisito nuovi significati nell'era dell'informatica grazie a:",["L'espansione metaforica del lessico, che riutilizza parole già esistenti","La creazione di segni completamente nuovi","L'eliminazione della sinonimia","L'adozione di un codice della certezza"],0,"Sono esempi di espansione metaforica del lessico, che riattribuisce nuovi significati a parole già esistenti."],["Quale fu il ruolo specifico dell'alfabeto fonetico nella storia delle tecnologie della parola?",["Sostituì completamente la comunicazione orale","Fu la prima tecnologia capace di riprodurre in modo sistematico la struttura articolata del linguaggio naturale","Fu inventato dopo la stampa a caratteri mobili","Non ebbe alcun impatto sullo sviluppo del pensiero astratto"],1,"L'alfabeto fonetico fu la prima tecnologia a riprodurre sistematicamente la struttura articolata del linguaggio."],["Cosa rese possibile la stampa a caratteri mobili rispetto alla scrittura?",["La conservazione del sapere per la prima volta nella storia","L'eliminazione della memoria collettiva","La diffusione del sapere su una scala fino ad allora impensabile","La nascita del linguaggio orale"],2,"La stampa rese possibile la diffusione del sapere su scala prima impensabile (la scrittura ne aveva già permesso la conservazione)."],["Oralità, scrittura, alfabeto, stampa, computer e intelligenza artificiale vengono presentati nella lezione come:",["Invenzioni indipendenti tra loro, senza alcun nesso storico","Fenomeni estranei all'evoluzione del linguaggio","Tecnologie in competizione che si sono progressivamente sostituite l'una con l'altra","Tappe di una medesima linea evolutiva che amplia le capacità cognitive della specie umana"],3,"Sono presentate come tappe di un'unica linea evolutiva che amplia le capacità cognitive umane."],["Quando diciamo che \"una persona è una macchina\", cosa intendiamo secondo l'esempio proposto nella lezione?",["Che la persona possiede straordinarie capacità fisiche o lavorative, non che sia letteralmente costruita in metallo: è un'estensione metaforica del significato","Che la persona è priva di sentimenti","Che si tratta di un caso di omonimia","Che il termine \"macchina\" ha perso ogni significato originario"],0,"È un'estensione metaforica: si intende che la persona ha straordinarie capacità fisiche o lavorative, non che sia letteralmente di metallo."],["Che ruolo svolge l'ambiguità nelle relazioni sociali, secondo la lezione?",["Nessuno: nelle relazioni sociali si ricercano solo messaggi univoci","Permette la continua negoziazione dei significati, dato che le persone comunicano spesso intenzioni, emozioni e giudizi oltre alle informazioni oggettive","Serve solo in ambito poetico e letterario","Riduce la coesione dei gruppi sociali"],1,"L'ambiguità permette la continua negoziazione dei significati, poiché le persone comunicano spesso intenzioni, emozioni e giudizi oltre alle informazioni oggettive."],["Quali tecniche svilupparono le società orali, prima dell'avvento della scrittura, per conservare e trasmettere il sapere?",["Sistemi di scrittura ideografica semplificata","Archivi centralizzati gestiti da specialisti","Tecniche mnemoniche fondate su ripetizione, ritmo, formula e narrazione","Codici numerici calcolabili"],2,"Le società orali svilupparono tecniche mnemoniche fondate su ripetizione, ritmo, formula e narrazione."]]},{"n":7,"title":"Perché l'evoluzione ha scelto un sistema così complesso","qs":[["Secondo la lezione, le proprietà universali del linguaggio (arbitrarietà, doppia articolazione, produttività, ricorsività, sinonimia, polisemia, ambiguità, variabilità...):",["Sono manifestazioni differenti di un unico sistema cognitivo complesso e si sostengono reciprocamente","Esistono come caratteristiche indipendenti tra loro","Possono essere eliminate singolarmente senza compromettere il sistema","Riguardano solo le lingue scritte"],0,"Le proprietà sono manifestazioni interdipendenti di un unico sistema cognitivo, non caratteristiche isolate."],["Perché i codici di comunicazione animale (vocalizzazioni dei cercopitechi, richiami territoriali degli uccelli, segnali chimici degli insetti eusociali) risultano molto efficienti nel loro contesto?",["Perché sono ambigui e flessibili","Perché ogni segnale corrisponde a un numero molto limitato di significati e il destinatario reagisce quasi automaticamente","Perché possiedono sinonimia infinita","Perché si evolvono continuamente come le lingue umane"],1,"Ogni segnale animale corrisponde a un numero limitato di significati, con reazione quasi automatica del destinatario."],["Qual è, secondo la lezione, la funzione principale delle lingue storico-naturali?",["Trasmettere informazioni con la massima precisione possibile, come un calcolo matematico","Sostituire completamente la comunicazione non verbale","Rendere possibile il pensiero simbolico, oltre alla semplice trasmissione di informazioni","Eliminare ogni forma di variabilità linguistica"],2,"La funzione principale è rendere possibile il pensiero simbolico, non solo trasmettere informazioni con precisione."],["Il linguaggio umano viene paragonato, in questa lezione, a strumenti come il martello e il telescopio perché:",["Il linguaggio, come questi strumenti, è stato inventato in tempi recenti","Sono tutti strumenti concreti, mentre il linguaggio è astratto","Non hanno alcun punto in comune con il linguaggio","Come questi strumenti, il linguaggio ha ampliato le capacità del pensiero, così come il martello ha ampliato le possibilità della mano"],3,"Il linguaggio, come il martello per la mano e il telescopio per l'occhio, ha ampliato le capacità del pensiero."],["Quali proprietà universali del linguaggio vengono elencate complessivamente nel corso?",["Arbitrarietà del segno, doppia articolazione, produttività, creatività, ricorsività, sinonimia, polisemia, ambiguità, variabilità e mutabilità delle lingue","Solo arbitrarietà e ricorsività","Solo le proprietà tipiche dei codici della certezza","Fonetica, fonologia, morfologia e sintassi"],0,"Le proprietà elencate sono arbitrarietà, doppia articolazione, produttività, creatività, ricorsività, sinonimia, polisemia, ambiguità, variabilità e mutabilità delle lingue."],["Perché, secondo la lezione, le proprietà universali del linguaggio non potrebbero essere eliminate singolarmente?",["Perché sono tra loro del tutto indipendenti","Perché sono interdipendenti: eliminarne anche solo una comprometterebbe il funzionamento dell'intero sistema","Perché riguardano solo le lingue scritte","Perché sono proprietà accessorie e non essenziali del linguaggio"],1,"Le proprietà sono interdipendenti: eliminarne anche solo una comprometterebbe il funzionamento dell'intero sistema."],["Da quale equilibrio nasce il linguaggio umano, secondo la lezione?",["Dall'equilibrio tra oralità e scrittura","Dall'equilibrio tra fonetica articolatoria e fonetica acustica","Dall'equilibrio tra la necessità che il messaggio venga compreso con sufficiente precisione e l'esigenza che il sistema resti abbastanza aperto da permettere la produzione continua di nuovi significati","Dall'equilibrio tra comunicazione diadica e triadica"],2,"Il linguaggio nasce dall'equilibrio tra la necessità di essere compreso con precisione e l'esigenza di restare aperto alla produzione di nuovi significati."]]},{"n":8,"title":"Glossario finale e domande di esercitazione","qs":[["Qual è la principale differenza tra comunicazione diadica e comunicazione triadica?",["La comunicazione triadica riguarda solo tre parlanti contemporaneamente","La comunicazione diadica realizza una relazione tra emittente e destinatario senza riferirsi a un referente esterno, mentre quella triadica rinvia anche a un referente esterno","La comunicazione diadica è tipica solo delle lingue storico-naturali","Non esiste alcuna differenza sostanziale tra le due"],1,"Diadico = nessun referente esterno; triadico = il messaggio rinvia anche a un referente esterno."],["Qual è una differenza fondamentale tra aritmetica e linguaggio naturale, secondo quanto esposto nel corso?",["Solo il linguaggio naturale possiede la proprietà della produttività","L'aritmetica è priva di regole combinatorie, il linguaggio naturale no","L'aritmetica possiede una sinonimia calcolabile e non è ambigua, mentre il linguaggio naturale ha sinonimia incalcolabile ed è ambiguo","L'aritmetica è dipendente dal contesto quanto il linguaggio naturale"],2,"L'aritmetica ha sinonimia calcolabile e nessuna ambiguità; il linguaggio naturale ha sinonimia incalcolabile ed è ambiguo."],["Cosa si intende per \"dipendenza dal contesto\"?",["La proprietà dei codici di avere un numero finito di elementi","L'assenza di una relazione naturale tra forma e significato","La capacità di generare frasi sempre più lunghe","La proprietà per cui il significato di una parola o di un enunciato può dipendere dalla situazione comunicativa e dal co-testo"],3,"È la dipendenza del significato dalla situazione comunicativa e dal co-testo."],["Cosa distingue la \"vaghezza\" dalla \"polisemia\"?",["La vaghezza è l'indeterminatezza del significato che permette interpretazioni diverse in base al contesto, mentre la polisemia è il possesso di più significati distinti e correlati da parte della stessa forma","Sono sinonimi perfetti, senza alcuna differenza","La vaghezza riguarda solo i suoni, la polisemia solo le frasi","La polisemia è una proprietà esclusiva dei codici della certezza"],0,"La vaghezza è indeterminatezza legata al contesto; la polisemia è il possesso di più significati correlati da parte della stessa forma."],["Come definisce il glossario finale del corso la \"creatività linguistica\"?",["La capacità di un codice di avere un numero infinito di elementi giustapposti","La capacità dei parlanti di produrre e comprendere enunciati nuovi e di modificare lessico, regole e significati","La proprietà dei codici della certezza di non ammettere variazioni","L'assenza di regole combinatorie in una lingua"],1,"È la capacità dei parlanti di produrre e comprendere enunciati nuovi e di modificare lessico, regole e significati."],["Come viene definito, nel glossario finale, il \"codice triadico\"?",["Un codice in cui il messaggio non ha alcun referente esterno","Un sistema con tre soli elementi combinabili","Un sistema nel quale il messaggio, oltre a mettere in relazione emittente e destinatario, rinvia anche a un referente esterno","Un codice usato esclusivamente da tre specie animali"],2,"È un sistema nel quale il messaggio, oltre a mettere in relazione emittente e destinatario, rinvia anche a un referente esterno."],["Come viene definita, nel glossario finale, la \"competenza comunicativa\"?",["La capacità di riconoscere i fonemi di una lingua straniera","L'insieme delle regole di cortesia linguistica","La capacità di produrre frasi grammaticalmente corrette, indipendentemente dal contesto","La capacità di utilizzare la competenza grammaticale in modo adeguato allo scopo e al contesto comunicativo"],3,"È la capacità di utilizzare la competenza grammaticale in modo adeguato allo scopo e al contesto comunicativo."]]}] }, { id: 'pretest-ling-l9-16', pack: 'LINGUISTICA GENERALE', unit: 'Lezione 9-16',

async function seedPretest(){
  for (const seed of PRETEST_SEEDS){
    if (mode === 'idb'){ try { if (await IDB.get(seed.id)) continue; } catch {} }
    const top = S.packs.find(x => x.name.trim().toUpperCase() === seed.pack && !x.parent);
    const u = top && unitsOf(top).find(x => x.name === seed.unit);
    if (!u) continue;
    u.pretest = u.pretest || [];
    for (const L of seed.lessons){
      let cur = pretestOf(u, L.n); if (!cur){ cur = { n: L.n, title: L.title, qs: [] }; u.pretest.push(cur); }
      const keys = new Set(cur.qs.map(keyOf));
      L.qs.forEach(([q, o, a, x], i) => { const it = { id: newId(), q, o, a, m: true, x, r: '', n: i + 1, s: { c: 0, w: 0, b: 0, t: 0 } }; if (!keys.has(keyOf(it))){ keys.add(keyOf(it)); cur.qs.push(it); } });
    }
    u.pretest.sort((a, b) => a.n - b.n);
    await savePack(u);
    if (mode === 'idb'){ try { await IDB.set(seed.id, true); } catch {} }
  }
}
async function seedGlossary(){
  for (const seed of GLOSSARY_SEEDS){
    if (mode === 'idb'){ try { if (await IDB.get(seed.id)) continue; } catch {} }
    const top = S.packs.find(x => x.name.trim().toUpperCase() === seed.pack && !x.parent);
    const p = top && seed.unit ? unitsOf(top).find(x => x.name === seed.unit) : top;
    if (!p) continue;   /* la parte non esiste ancora: riprova dopo seedUnits() */
    addTerms(p, seed.terms.map(([t, d]) => ({ t, d })), seed.lesson);
    await savePack(p);
    if (mode === 'idb'){ try { await IDB.set(seed.id, true); } catch {} }
  }
}
/* Materie già pronte per ogni anno. Vengono create una sola volta (PRESETS_ID): se ne elimini una, non ricompare.
   Per aggiungerne altre in futuro, aggiungile qui e cambia PRESETS_ID. */
const PRESETS_ID = 'presets-1';
const PRESETS = {
  1: ['GEOGRAFIA CULTURALE', 'LETTERATURA INGLESE 1 B', 'LINGUA E TRADUZIONE INGLESE 1 A', 'LINGUISTICA GENERALE']
};
async function seedPresets(){
  let done = false;
  if (mode === 'idb'){ try { done = !!(await IDB.get(PRESETS_ID)); } catch {} }
  if (done) return;
  const have = new Set(S.packs.map(p => p.name.trim().toLowerCase()));
  let t = Date.now();
  for (const [y, names] of Object.entries(PRESETS)) for (const name of names){
    if (have.has(name.toLowerCase())) continue;
    const p = { id: newId(), name, year: +y, kind: 'paniere', created: t++, qs: [], src: '', qtype: 'miste' };
    S.packs.push(p); await savePack(p);
  }
  if (mode === 'idb'){ try { await IDB.set(PRESETS_ID, true); } catch {} }
}
async function boot(){
  render();
  try { await IDB.open(); mode = 'idb'; } catch (e){ console.error(e); mode = 'memory'; }
  if (mode === 'idb'){
    try { apiKey = (await IDB.get('apiKey')) || ''; } catch { apiKey = ''; }
    try { S.packs = await loadAll(); } catch (e){ console.error(e); toast('Non riesco a leggere i materiali salvati'); }
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  }
  for (const p of S.packs) p.year = fixYear(p.year);
  for (const p of S.packs) for (const q of p.qs){ if (q.n === undefined) q.n = null; if (q.f === undefined) q.f = ''; }
  await seedPresets();
  await seedGlossary();
  await seedUnits();
  await seedGlossary();
  await seedQuestions();
  await seedPretest();
  sample = apiKey ? makeSample() : null;
  S.view = 'home'; render();
}
if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(console.error));
}
boot();
})();

</script>
